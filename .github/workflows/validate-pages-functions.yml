name: Validate Pages Functions

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-pages-functions.yml
      - functions/**
      - scripts/generate-checkout-catalog.mjs
      - content/site.json
      - package.json

permissions:
  contents: read

jobs:
  bundle-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci
      - run: npm run generate:checkout
      - name: Bundle Cloudflare Pages Functions
        run: npx --yes wrangler@4.114.0 pages functions build functions --outdir .wrangler-check
