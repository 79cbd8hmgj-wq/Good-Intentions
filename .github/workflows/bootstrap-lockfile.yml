name: Bootstrap npm lockfile

on:
  push:
    branches:
      - foundation/astro-storefront
    paths:
      - .github/workflows/bootstrap-lockfile.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: foundation/astro-storefront
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org

      - name: Generate genuine npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify locked installation
        run: npm ci

      - name: Validate content
        run: npm run verify:content

      - name: Run Astro and TypeScript checks
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "Add generated npm lockfile"
            git push origin HEAD:foundation/astro-storefront
          fi
