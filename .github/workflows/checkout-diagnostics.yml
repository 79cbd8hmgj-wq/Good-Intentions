name: Checkout diagnostics

on:
  push:
    branches:
      - feature/stripe-checkout-foundation
    paths:
      - .github/workflows/checkout-diagnostics.yml
      - functions/**
      - src/**
      - scripts/**
      - content/**
      - package.json

permissions:
  contents: write

jobs:
  capture-check-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stripe-checkout-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci

      - name: Capture check output
        run: |
          set +e
          npm run check > /tmp/checkout-check.log 2>&1
          status=$?
          tail -160 /tmp/checkout-check.log > CHECKOUT_CHECK_OUTPUT.txt
          echo "CHECK_EXIT_STATUS=$status" >> CHECKOUT_CHECK_OUTPUT.txt
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKOUT_CHECK_OUTPUT.txt
          if git diff --cached --quiet; then
            echo "Diagnostic output unchanged."
          else
            git commit -m "Capture checkout check diagnostics"
            git push origin HEAD:feature/stripe-checkout-foundation
          fi
